<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>논문읽기 도우미</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --border:#e3e5ea; --text:#1b1f24; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#e3ecff; --green:#15803d; --green-soft:#dcfce7;
  --amber:#b45309; --amber-soft:#fef3c7; --red:#dc2626; --red-soft:#fee2e2;
  --orig-bg:#f8f9fb; --ko-bg:#eef4ff;
  --heat0:#e6e8ee; --heat1:#bfdbfe; --heat2:#60a5fa; --heat3:#1d4ed8;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05);
}
[data-theme=dark]{
  --bg:#0f1115; --card:#181b22; --border:#2a2f3a; --text:#e8eaee; --muted:#9aa3b2;
  --accent:#60a5fa; --accent-soft:#1e2a44; --green:#4ade80; --green-soft:#14301f;
  --amber:#fbbf24; --amber-soft:#3a2b0c; --red:#f87171; --red-soft:#3b1414;
  --orig-bg:#13161c; --ko-bg:#1a2233;
  --heat0:#232833; --heat1:#1e3a8a; --heat2:#2563eb; --heat3:#93c5fd;
  --shadow:none;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
  --bg:#0f1115; --card:#181b22; --border:#2a2f3a; --text:#e8eaee; --muted:#9aa3b2;
  --accent:#60a5fa; --accent-soft:#1e2a44; --green:#4ade80; --green-soft:#14301f;
  --amber:#fbbf24; --amber-soft:#3a2b0c; --red:#f87171; --red-soft:#3b1414;
  --orig-bg:#13161c; --ko-bg:#1a2233;
  --heat0:#232833; --heat1:#1e3a8a; --heat2:#2563eb; --heat3:#93c5fd;
  --shadow:none;
}}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
a{color:var(--accent)}
button{font-family:inherit}
.app{max-width:720px;margin:0 auto;padding:16px 16px 96px}

/* 상단 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.topbar h1{font-size:1.25rem;font-weight:700}
.topbar p{color:var(--muted);font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:6px}
.icon-btn{flex:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--bg)}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.gray{background:var(--border);color:var(--muted)}

/* 카드 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card ol,.card ul{padding-left:20px}
.card li{margin-bottom:5px;font-size:.92rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* 배너 */
.banner{border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner.todo{background:var(--accent-soft);color:var(--accent)}
.banner.done{background:var(--green-soft);color:var(--green)}
.banner strong{font-size:.95rem}
.banner .sub{font-size:.8rem;opacity:.85}

/* 논문 정보 */
.paper-card h2{font-size:1.1rem;line-height:1.45;margin-bottom:6px}
.paper-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:.76rem;font-weight:500;background:var(--border);color:var(--muted)}
.tag.venue{background:var(--accent-soft);color:var(--accent)}
.tag.field{background:var(--green-soft);color:var(--green)}
.tag a{text-decoration:none;color:inherit}
.why{background:var(--amber-soft);color:var(--amber);padding:8px 12px;border-radius:8px;font-size:.86rem;line-height:1.55}

/* 단락 점 */
.dots{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--card);color:var(--muted);transition:.15s}
.dot:hover{border-color:var(--accent)}
.dot.done{border-color:var(--green);background:var(--green);color:#fff}
.dot.active{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.sec-head h2{font-size:1.02rem;font-weight:700}

/* 핵심 개념 */
.term{padding:8px 0;border-top:1px solid var(--border);font-size:.9rem}
.term:first-child{border-top:none;padding-top:0}
.term-row{display:flex;align-items:flex-start;gap:8px}
.term .body{flex:1}
.term .name{font-weight:700;color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:4px;font-size:.86rem}
.term .desc{display:block;margin-top:3px}
.term-btns{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.term .add{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font-size:.74rem;cursor:pointer;white-space:nowrap}
.term .add.on{background:var(--green-soft);color:var(--green);border-color:transparent}
.basic-hint{border:1px solid var(--accent-soft);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 8px;font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap}
.basic-box{display:none;margin-top:8px;padding:9px 11px;background:var(--accent-soft);border-radius:8px;font-size:.85rem;line-height:1.7;color:var(--text)}
.basic-box.open{display:block}

/* 용어 사전 */
.gloss-item{padding:9px 0;border-top:1px solid var(--border)}
.gloss-item:first-child{padding-top:0;border-top:none}
.gloss-item .gt{font-weight:700;font-size:.92rem;margin-bottom:3px}
.gloss-item .gd{font-size:.86rem;line-height:1.7;color:var(--muted)}

/* 원문 */
.orig{background:var(--orig-bg);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0}
.orig .hint{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.sent{padding:4px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;transition:background .15s}
.sent:hover{background:var(--accent-soft)}
.sent .en{font-size:.95rem;line-height:1.8;font-family:Georgia,'Times New Roman',serif}
.sent.open .en{color:var(--accent)}
.sent .ko{display:none;margin:6px 0 4px;padding:8px 10px;background:var(--ko-bg);border-radius:8px;font-size:.88rem;line-height:1.6;cursor:default}
.sent.open .ko{display:block}
.sent .ko .note{margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);color:var(--muted);font-size:.82rem}
.sent .ko .note b{color:var(--amber)}
.linkbtn{background:none;border:none;color:var(--accent);font-size:.8rem;cursor:pointer;font-weight:600;padding:0}

/* 버튼 */
.actions{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:12px 14px;border:none;border-radius:10px;font-size:.92rem;font-weight:600;cursor:pointer;text-align:center;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{flex:none;padding:8px 12px;font-size:.82rem;min-width:0}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:20px}

.done-card{text-align:center;padding:22px 16px}
.done-card .big{font-size:2rem;margin-bottom:6px}
.done-card h3{justify-content:center;font-size:1.05rem}
.done-card p{font-size:.88rem;color:var(--muted);margin-bottom:12px}

/* 가이드 */
.guide{font-size:.82rem;line-height:1.7;color:var(--muted)}
.guide strong{color:var(--text)}

/* 논문 목록 */
.plist .item{display:block;cursor:pointer}
.plist .item:hover{border-color:var(--accent)}
.plist .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plist .num{color:var(--muted);font-size:.8rem;font-weight:600}
.plist h4{font-size:.98rem;line-height:1.4;margin:2px 0 4px}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.bar.full>div{background:var(--green)}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;text-align:center}
.tile .v{font-size:1.4rem;font-weight:700;line-height:1.2}
.tile .l{font-size:.74rem;color:var(--muted);margin-top:2px}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .c{width:13px;height:13px;border-radius:3px;background:var(--heat0)}
.heat .c.l1{background:var(--heat1)}.heat .c.l2{background:var(--heat2)}.heat .c.l3{background:var(--heat3)}
.heat .c.future{opacity:.25}
.heat-months{display:flex;gap:3px;font-size:.68rem;color:var(--muted);margin-bottom:4px}
.heat-months span{width:13px;flex:none;white-space:nowrap}
.legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);margin-top:6px;justify-content:flex-end}
.legend .c{width:11px;height:11px;border-radius:2px;background:var(--heat0)}
.settings label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 6px}
.settings select,.settings textarea,.settings input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.88rem;font-family:inherit}
.settings textarea{min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem}
.settings .row{display:flex;gap:8px;margin-top:8px}
.settings .chk{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:.88rem;font-weight:600;cursor:pointer}
.settings .chk input{width:auto;accent-color:var(--accent)}

/* 단어장 */
.search{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:.9rem;margin-bottom:10px}
.vitem{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.vitem:first-child{border-top:none}
.vitem .t{font-weight:700;font-size:.9rem}
.vitem .d{font-size:.84rem;color:var(--muted);margin-top:2px}
.vitem .meta{font-size:.72rem;color:var(--muted);margin-top:3px}
.vitem .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}
.box{display:inline-block;padding:0 6px;border-radius:4px;font-size:.7rem;font-weight:600;background:var(--border);color:var(--muted)}
.box.b1{background:var(--red-soft);color:var(--red)}.box.b2{background:var(--amber-soft);color:var(--amber)}.box.b3{background:var(--accent-soft);color:var(--accent)}.box.b4{background:var(--green-soft);color:var(--green)}
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:28px 18px}
.flash .term{font-size:1.35rem;font-weight:700;border:none;padding:0;display:block}
.flash .src{font-size:.78rem;color:var(--muted);margin-top:8px}
.flash .ans{font-size:.95rem;line-height:1.7;margin-top:6px}
.flash .tap{font-size:.78rem;color:var(--muted);margin-top:14px}
.form-row{display:flex;flex-direction:column;gap:8px}
.form-row input{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.88rem}

/* 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar .inner{display:flex;width:100%;max-width:720px}
.tab{flex:1;background:none;border:none;padding:9px 4px 7px;font-size:.72rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
.tab .ic{font-size:1.25rem}
.tab.active{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.84rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.view{display:none}.view.active{display:block}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.9rem}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><h1>📖 논문읽기 도우미</h1><p>하루에 한 단락씩. 조금씩, 꾸준히.</p></div>
    <div class="topbar-right">
      <span class="chip" id="streakChip">🔥 0일</span>
      <button class="icon-btn" onclick="showView('settings')" title="설정" aria-label="설정">⚙️</button>
    </div>
  </div>
  <section class="view active" id="view-today"></section>
  <section class="view" id="view-papers"></section>
  <section class="view" id="view-stats"></section>
  <section class="view" id="view-vocab"></section>
  <section class="view" id="view-glossary"></section>
  <section class="view" id="view-settings"></section>
</div>
<nav class="tabbar"><div class="inner">
  <button class="tab active" data-view="today"><span class="ic">📖</span>오늘</button>
  <button class="tab" data-view="glossary"><span class="ic">📘</span>용어</button>
  <button class="tab" data-view="papers"><span class="ic">📚</span>논문</button>
  <button class="tab" data-view="stats"><span class="ic">📅</span>기록</button>
  <button class="tab" data-view="vocab"><span class="ic">🃏</span>단어장</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
const PAPERS = /*__PAPERS_JSON__*/[];
// === 왕초보 용어 사전 (논문 지식이 전혀 없어도 읽을 수 있도록) ===
const GLOSSARY = [
  { cat: 'basic', term: '인공지능 (AI)', alias: ['artificial intelligence'], desc: '컴퓨터가 사람처럼 보고 듣고 판단하도록 만든 프로그램을 통틀어 부르는 말입니다. 사진 속 강아지를 알아보거나 스팸 메일을 걸러내는 것도 모두 인공지능의 한 종류입니다.' },
  { cat: 'basic', term: '머신러닝 (기계학습)', alias: ['machine learning'], desc: '규칙을 사람이 일일이 정해주는 대신, 컴퓨터에게 아주 많은 예시를 보여주고 스스로 규칙을 찾아내게 만드는 방법입니다. 고양이 사진 수천 장을 보여주면 컴퓨터가 고양이의 특징을 스스로 알아내는 식입니다.' },
  { cat: 'basic', term: '인공신경망 (neural network)', alias: ['neural network', '신경망'], desc: '사람 뇌 속 신경세포(뉴런)들이 서로 연결되어 신호를 주고받는 방식을 흉내 낸 계산 구조입니다. 아주 단순한 계산을 하는 작은 부품을 수백만 개 연결해서 복잡한 일을 해내게 만듭니다.' },
  { cat: 'basic', term: '뉴런 / 유닛', alias: ['neuron', 'unit'], desc: '신경망을 이루는 가장 작은 계산 단위입니다. 숫자 여러 개를 받아 하나의 숫자로 계산해서 다음 뉴런에게 넘겨주는, 아주 단순한 작은 계산기라고 생각하면 됩니다.' },
  { cat: 'basic', term: '층 / 레이어 (layer)', alias: ['layer', '층'], desc: '뉴런을 한 줄로 모아놓은 것입니다. 신경망은 이런 층을 여러 겹 쌓아 만드는데, 층을 많이 쌓을수록 더 복잡한 것을 배울 수 있습니다.' },
  { cat: 'basic', term: '딥러닝 (deep learning)', alias: ['deep learning', '딥러닝'], desc: '층을 아주 깊게(많이) 쌓은 신경망으로 학습하는 방법입니다. 여기 실린 논문들은 대부분 "깊은 신경망을 어떻게 하면 잘 학습시킬 수 있을까"를 다룹니다.' },
  { cat: 'train', term: '파라미터 / 가중치 (weight)', alias: ['parameter', 'weight', '가중치', '파라미터'], desc: '신경망 안에서 학습을 통해 조금씩 값이 바뀌는 숫자들입니다. 라디오의 볼륨 손잡이처럼, 이 숫자들을 잘 맞춰야 신경망이 좋은 답을 냅니다. "파라미터 6천만 개"라는 말은 조절할 손잡이가 6천만 개 있다는 뜻입니다.' },
  { cat: 'train', term: '학습 / 훈련 (training)', alias: ['training', '학습'], desc: '신경망에게 문제와 정답을 계속 보여주면서 파라미터(숫자 손잡이)를 조금씩 고쳐, 정답에 더 가까운 답을 내도록 만드는 과정입니다. 문제집을 풀고 채점받아 틀린 곳을 고쳐나가는 것과 비슷합니다.' },
  { cat: 'train', term: '데이터셋 (dataset)', alias: ['dataset', '데이터셋'], desc: '신경망에게 보여주는 예시들의 모음입니다. 대개 "문제"(사진이나 문장)와 그에 대한 "정답"이 쌍으로 들어 있습니다.' },
  { cat: 'train', term: '손실 함수 (loss function)', alias: ['loss function', '손실'], desc: '신경망이 낸 답이 정답과 얼마나 다른지를 하나의 점수로 나타낸 것입니다. 이 점수가 낮을수록 잘 맞힌 것이고, 학습의 목표는 이 점수를 계속 낮추는 것입니다.' },
  { cat: 'train', term: '기울기 / 그래디언트 (gradient)', alias: ['gradient', '기울기'], desc: '지금 파라미터를 어느 방향으로 바꾸면 손실(오답 정도) 점수가 줄어드는지 알려주는 나침반 같은 것입니다.' },
  { cat: 'train', term: '경사 하강법 (gradient descent)', alias: ['gradient descent', '경사 하강'], desc: '기울기가 가리키는 방향으로 파라미터를 아주 조금씩 계속 옮겨서, 손실 점수를 산비탈을 내려가듯 점점 줄이는 학습 방법입니다.' },

function escRe(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function matchGlossary(name) {
  // 영단어 별칭은 단어 경계로 정확히 맞춰본다 (예: "neural network"가 "neural networks"에 안 걸리도록).
  // 여러 항목이 걸리면 가장 길게 맞은 별칭을 쓴 항목이 더 구체적인 것으로 보고 그것을 택한다.
  const n = name.toLowerCase();
  let best = null, bestLen = 0;
  for (const g of GLOSSARY) {
    for (const a of g.alias) {
      const al = a.toLowerCase();
      const isAscii = /^[a-z0-9][a-z0-9 -]*$/.test(al);
      const hit = isAscii ? new RegExp('\\b' + escRe(al) + '\\b', 'i').test(name) : n.includes(al);
      if (hit && al.length > bestLen) { best = g; bestLen = al.length; }
    }
  }
  return best;
}
const STORE_KEY = 'prd_state_v2';

const QUEUE = [];

const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); }
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
const paperUrl = p => p.url || ('https://arxiv.org/abs/' + p.arxiv);

// ---------- 상태 ----------
function defaultState() { return { version: 2, read: {}, days: {}, vocab: {}, cursor: null, theme: 'auto', fontSize: 'md', autoKo: false }; }
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch {}
  if (!s || s.version !== 2) {
    s = defaultState();
    try { const old = JSON.parse(localStorage.getItem('paper_progress') || '{}'); for (const k in old) if (old[k]) s.read[k] = ''; } catch {}
  }
  for (const k of ['read', 'days', 'vocab']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  if (!s.theme) s.theme = 'auto';
  if (!s.fontSize) s.fontSize = 'md';
  if (typeof s.autoKo !== 'boolean') s.autoKo = false;
  return s;
}
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} }

// ---------- 큐/커서 ----------
const qIndex = (pi, si) => QUEUE.findIndex(q => q.pi === pi && q.si === si);
const isRead = q => q.key in S.read;
function nextUnread(pi, si, inclusive = true) {
  const start = Math.max(qIndex(pi, si), 0), n = QUEUE.length;
  for (let k = 0; k < n; k++) { const q = QUEUE[(start + (inclusive ? k : k + 1)) % n]; if (!isRead(q)) return q; }
  return null;
}
let cur = { pi: 0, si: 0 };
(function initCursor() {
  if (S.cursor && PAPERS[S.cursor.pi] && PAPERS[S.cursor.pi].sections[S.cursor.si]) cur = { ...S.cursor };
  const q = QUEUE[qIndex(cur.pi, cur.si)];
  if (q && isRead(q)) { const nx = nextUnread(cur.pi, cur.si); if (nx) cur = { pi: nx.pi, si: nx.si }; }
})();
function setCursor(pi, si) { cur = { pi, si }; S.cursor = { pi, si }; save(); }

function streak() { let d = today(); if (!S.days[d]) d = addDays(d, -1); let n = 0; while (S.days[d] > 0) { n++; d = addDays(d, -1); } return n; }
function longestStreak() {
  const ds = Object.keys(S.days).filter(k => S.days[k] > 0).sort(); let best = 0, run = 0, prev = null;
  for (const d of ds) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; } return best;
}

    <div class="card flash" onclick="flipCard()"><span class="term">${esc(t)}</span>${ss.flipped ? `<div class="ans">${esc(v.desc)}</div>` : ''}<div class="src">${p ? esc(shortName(p)) : '직접 추가'} · <span class="box b${v.box || 1}">상자 ${v.box || 1}</span></div>${ss.flipped ? '' : '<div class="tap">눌러서 뜻 확인</div>'}</div>
    ${ss.flipped ? `<div class="actions"><button class="btn ghost" onclick="grade(false)">😅 모르겠어요</button><button class="btn primary" onclick="grade(true)">😀 알아요</button></div>` : '<div class="actions"><button class="btn ghost" onclick="flipCard()">뒤집기</button></div>'}`;

function renderGlossary() {
  const el = $('view-glossary');
  let html = `<div class="card guide" style="margin-bottom:12px"><strong>📘 왕초보 용어 사전</strong> · "RNN이 뭐지", "파라미터가 뭐지" 싶을 때 여기서 찾아보세요. 중학생도 이해할 수 있게 비유로 설명했습니다. 핵심 개념 카드의 📘 버튼을 누르면 그 자리에서 바로 펼쳐볼 수도 있어요.</div>`;
  html += `<input class="search" placeholder="용어 검색 (예: RNN, 학습, 파라미터)" value="${esc(glossaryQuery)}" oninput="glossaryQuery=this.value;renderGlossaryList()">`;
  html += `<div id="glossaryList"></div>`;
  el.innerHTML = html;
  renderGlossaryList();
}
function renderGlossaryList() {
  const box = $('glossaryList'); if (!box) return;
  const q = glossaryQuery.trim().toLowerCase();
  const cats = [['basic', '🧠 아주 기초'], ['train', '📈 학습은 어떻게 되나'], ['struct', '🧩 논문에 자주 나오는 구조']];
  let html = '';
  for (const [key, label] of cats) {
    const items = GLOSSARY.filter(g => g.cat === key && (!q || g.term.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q) || g.alias.some(a => a.toLowerCase().includes(q))));
    if (!items.length) continue;
    html += `<div class="card"><h3>${label}</h3>` + items.map(g => `<div class="gloss-item"><div class="gt">${esc(g.term)}</div><div class="gd">${esc(g.desc)}</div></div>`).join('') + '</div>';
  }
  box.innerHTML = html || '<div class="empty">검색 결과가 없어요</div>';
}

// ---------- 시작 ----------
applyTheme();
applyFontSize();
renderAll();
